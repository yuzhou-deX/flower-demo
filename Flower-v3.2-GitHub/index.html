<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower · 原型 v3.3</title>
<style>
:root{
  color-scheme: dark;
  --bg:#060507; --panel:#110E13; --card:#18141B; --raised:#231D27; --line:#2C2530;
  --pink:#FF3E8E; --pink-2:#C21E6A; --peach:#FFB59A;
  --text:#F6EFF3; --muted:#9C929F; --gold:#FFC857; --ok:#5FD6A4;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
svg{display:block}
.view{display:none}.view.on{display:flex}

/* ---------- 外壳 ---------- */
#app{min-height:100vh}
.side{width:232px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 20px;font-weight:700;font-size:20px;letter-spacing:.5px;cursor:pointer}
.logo b{color:var(--pink)}
.btn-create{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:var(--r-md);
  background:linear-gradient(100deg,var(--pink),#FF7AB0);font-weight:600;color:#fff;margin-bottom:16px;
  box-shadow:0 6px 20px -6px rgba(255,62,142,.6)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;position:relative}
.nav a:hover{background:var(--raised);color:var(--text)}
.nav a.cur{background:rgba(255,62,142,.12);color:var(--text)}
.nav a.cur::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--pink)}
.nav .badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--pink)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.daily{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:var(--r-md);
  background:linear-gradient(135deg,#2A1020,#1A1220);border:1px solid #3A1A2E;text-align:left}
.daily small{display:block;color:var(--muted);font-size:11px}
.daily strong{font-size:13px}
.daily .amt{font-size:22px;font-weight:700;color:var(--pink)}
.daily.done{background:var(--card);border-color:var(--line)}
.daily.done .amt{color:var(--muted);font-size:14px}
.me{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);width:100%}
.me:hover{background:var(--raised)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FF8FBF,#7B5CFF);flex:none}

.main{flex:1;min-width:0;padding:16px 28px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.search{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:22px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:none}
.search .clear{color:var(--muted)}
.coin{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:22px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.coin:hover{border-color:#4A3A48}
i.c{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFD5E6,var(--pink) 60%,var(--pink-2));display:inline-block;flex:none}
.plan{padding:5px 12px;border-radius:16px;background:var(--raised);font-size:12px;font-weight:600}
.plan.vip{background:linear-gradient(100deg,var(--pink),#FF7AB0);color:#fff}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.lang{height:44px;padding:0 14px;border-radius:22px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:6px}

.tabs{display:flex;gap:28px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 0 12px;font-size:17px;font-weight:600;color:var(--muted);position:relative}
.tabs button.cur{color:var(--text)}
.tabs button.cur::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--pink)}
.tabs.sm button{font-size:15px}

.filters{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.select{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.select:hover{border-color:#4A3A48}
.select.on{border-color:var(--pink);color:#FF8FBF}
.toggle{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.sw{width:36px;height:20px;border-radius:10px;background:var(--raised);position:relative;flex:none}
.sw.on{background:var(--pink)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on::after{left:18px}
.filters .spacer{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:#D9CFD6}
.chip:hover{border-color:#4A3A48}
.chip.cur{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.chip.event{color:var(--pink);border-color:#5A2240;background:#1F0E18}
.chip.event.cur{color:#fff;background:var(--pink)}
.result{color:var(--muted);font-size:13px;margin:-6px 0 14px}
.result button{color:var(--pink);margin-left:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card{position:relative}
.card.previewing{overflow:visible;z-index:4}
.role-preview{position:absolute;top:-1px;bottom:-1px;display:grid;grid-template-columns:44% minmax(0,1fr);
  border:1px solid #8a4d6c;border-radius:var(--r-lg);overflow:hidden;background:var(--card);
  box-shadow:0 14px 42px #0009;isolation:isolate}
.motion .role-preview{animation:preview-in .16s ease-out}
@keyframes preview-in{from{opacity:.45;transform:scale(.985)}}
.preview-art{width:100%;height:100%;min-height:0;object-fit:cover;object-position:center 20%}
.preview-info{min-height:0;display:flex;flex-direction:column;gap:12px;padding:20px;background:linear-gradient(145deg,#29212b,var(--card))}
.preview-info h3{font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.preview-copy{min-height:0;overflow:auto;flex:1;overscroll-behavior:contain;line-height:1.7;color:#dcd2d8}
.preview-copy p+p{margin-top:10px}
.preview-info .by{color:#ffa9ce;align-self:flex-start}
.preview-meta{color:var(--muted);font-size:12px}
.preview-actions{display:flex;align-items:center;gap:8px}
.preview-actions .pri{flex:1}
.card:hover{border-color:#5A2E48}
.cover{position:relative;aspect-ratio:4/5;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(24,20,27,.95))}
img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.motion .card:hover img.art{transform:scale(1.06);transition:transform 3s ease-out}
.stat{position:absolute;right:10px;bottom:10px;z-index:1;display:flex;gap:10px;font-size:12px;color:#E8DDE4}
.stat span{display:flex;align-items:center;gap:4px}
.stat .new{padding:2px 8px;border-radius:6px;background:var(--pink);color:#fff;font-weight:600}
.fav{position:absolute;top:10px;right:10px;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.fav.on{color:var(--pink);background:rgba(255,255,255,.9)}
.fav.on svg path{fill:var(--pink)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-weight:700;font-size:15px}
.desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--raised);color:#CFC4CC}
.tag.kind{background:rgba(255,62,142,.14);color:#FF8FBF;display:flex;align-items:center;gap:4px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:12px;color:var(--muted)}
.foot .by{color:var(--pink)}
.foot .by:hover{text-decoration:underline}
.promo{border-radius:var(--r-lg);overflow:hidden;position:relative;background:
  radial-gradient(120% 80% at 80% 10%,#FF7AB0 0%,transparent 55%),
  radial-gradient(90% 70% at 10% 90%,#7A1340 0%,transparent 60%),#2A0B1B;
  display:flex;flex-direction:column;justify-content:flex-end;padding:22px;min-height:360px;border:1px solid #5A2240}
.promo .big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-1px}
.promo p{margin:8px 0 16px;color:#FFD5E6}
.promo button{height:42px;border-radius:21px;background:#fff;color:var(--pink-2);font-weight:700}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:70px 0;color:var(--muted);text-align:center}
.empty strong{color:var(--text);font-size:16px}
.empty .btn-create{margin:12px 0 0;padding:0 22px}

/* ---------- 通用页面元素 ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 18px}
.ph h1{font-size:24px;font-weight:700}
.ph p{color:var(--muted);margin-top:4px}
.btn{height:38px;padding:0 16px;border-radius:19px;background:var(--raised);border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:#4A3A48}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.pri:hover{background:#FF5A9E}
.btn.ghost{background:none}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.box h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.box h3 small{font-weight:400;color:var(--muted);font-size:12px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:var(--r-md);cursor:pointer}
.row:hover{background:var(--raised)}
.row + .row{border-top:1px solid var(--line)}
.row:hover + .row{border-top-color:transparent}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;position:relative;flex:none}
.thumb.round{border-radius:50%;width:44px;height:44px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--muted);font-size:12px;text-align:right;flex:none}
.rank{width:30px;text-align:center;font-weight:800;font-size:18px;color:var(--muted);flex:none}
.rank.top{color:var(--pink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.unread{width:8px;height:8px;border-radius:50%;background:var(--pink);flex:none}

/* 奖励 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{border-radius:var(--r-md);background:var(--raised);padding:12px 6px;text-align:center;border:1px solid transparent}
.day small{color:var(--muted);display:block;font-size:12px}
.day b{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px}
.day.got{background:rgba(255,62,142,.12);border-color:rgba(255,62,142,.4)}
.day.today{border-color:var(--pink)}
.task{display:flex;align-items:center;gap:14px;padding:12px 0}
.task + .task{border-top:1px solid var(--line)}
.task .t{flex:1}
.task .t span{color:var(--muted);font-size:12px;display:block}
.bar{height:6px;border-radius:3px;background:var(--raised);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--peach))}
.reward{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--pink);flex:none;width:64px}

/* 会员与花瓣 */
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.plancard li.off{color:var(--muted)}
.plancard li.off svg{color:var(--muted)}
.plancard{position:relative;display:flex;flex-direction:column;gap:10px}
.plancard.hl{border-color:var(--pink);background:linear-gradient(180deg,#24101C,var(--card))}
.plancard .price{font-size:30px;font-weight:800}
.plancard .price small{font-size:13px;color:var(--muted);font-weight:400}
.plancard ul{list-style:none;display:flex;flex-direction:column;gap:6px;color:#DCD2D8;flex:1}
.plancard li{display:flex;gap:8px}
.plancard li svg{color:var(--pink);flex:none;margin-top:3px}
.ribbon{position:absolute;top:-10px;right:16px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px}
.packs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pack{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;text-align:center;background:var(--raised)}
.pack:hover{border-color:var(--pink)}
.pack b{display:flex;align-items:center;justify-content:center;gap:6px;font-size:20px}
.pack small{display:block;color:var(--pink);font-size:12px;min-height:18px}
.pack span{display:block;margin-top:8px;color:var(--muted)}
table.cost{width:100%;border-collapse:collapse}
table.cost td,table.cost th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.cost th{color:var(--muted);font-weight:500;font-size:12px}

/* 个人主页 / 表单 */
.profile{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.profile .avatar{width:72px;height:72px}
.profile h1{font-size:22px}
.profile p{color:var(--muted)}
.nums{display:flex;gap:28px;margin-left:auto}
.nums div{text-align:center}
.nums b{display:block;font-size:20px}
.nums span{color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:#DCD2D8;font-weight:600}
.field label small{color:var(--muted);font-weight:400;margin-left:6px}
.field input,.field textarea,.field select{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;outline:none;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--pink)}
.field .err{color:#FF7A9C;font-size:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{height:32px;padding:0 14px;border-radius:16px;background:var(--raised);border:1px solid var(--line);font-size:13px}
.seg button.cur{border-color:var(--pink);color:#FF8FBF;background:rgba(255,62,142,.1)}
.covers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.covers button{aspect-ratio:3/4;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent}
.covers button.cur{border-color:var(--pink)}
.create{display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:start}
.create .preview{position:sticky;top:16px}
.create .preview .card{cursor:default}
.formbar{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

/* ---------- 弹层 ---------- */
.menu{position:fixed;z-index:60;min-width:180px;max-height:min(420px,70vh);overflow:auto;padding:6px;border-radius:var(--r-md);background:#1D1821;border:1px solid #3A3040;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--r-sm);text-align:left}
.menu button:hover{background:var(--raised)}
.menu button.cur{color:#FF8FBF}
.menu button .r{margin-left:auto;color:var(--muted);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .tagpick{display:flex;flex-wrap:wrap;gap:6px;padding:6px;max-width:360px}
.menu .tagpick button{width:auto;padding:4px 10px;border-radius:14px;background:var(--raised);font-size:12px}
.menu .tagpick button.cur{background:var(--pink);color:#fff}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;width:min(560px,100%);max-height:90vh;overflow:auto;position:relative}
.modal .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.4);z-index:2}
.modal .pad{padding:22px}
.modal h2{font-size:20px;margin-bottom:6px}
.modal .sub{color:var(--muted);margin-bottom:16px}
.detail{display:grid;grid-template-columns:220px 1fr;width:min(760px,100%)}
.detail .pic{position:relative;min-height:340px}
.detail .pad h2{padding-right:40px}
.detail .open{margin:14px 0;padding:12px 14px;border-radius:var(--r-md);background:var(--raised);color:#E6DCE2;font-size:13px;line-height:1.7}
.detail dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:13px;margin:12px 0}
.detail dt{color:var(--muted)}
.detail .acts2{display:flex;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);opacity:0;z-index:80;padding:10px 18px;border-radius:20px;background:#2A2230;border:1px solid #43384A;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.2s;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 聊天页 ---------- */
#chat{height:100vh;overflow:hidden}
.stage{flex:1;position:relative;overflow:hidden}
.stage img.art{object-position:center 15%}
.stage .back{position:absolute;top:18px;left:18px}
.room{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;overflow:clip}
.room .bgblur{position:absolute;inset:-40px;filter:blur(36px) brightness(.35) saturate(1.2);transform:scale(1.1)}
.room .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,5,7,.55),rgba(6,5,7,.8))}
.room.clear .bgblur{filter:brightness(.3);inset:0;transform:none}
.room > .roombar,.room > .feed,.room > .dock{position:relative}
.roombar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:18px 22px}
.roombar .title{margin-right:auto;font-weight:700;font-size:16px;display:none}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1)}
.glass:hover{border-color:rgba(255,255,255,.22)}
.pill{height:40px;padding:0 14px;border-radius:20px;display:flex;align-items:center;gap:8px;font-weight:600}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.round.on{color:var(--pink)}
.round.on svg path{fill:var(--pink)}
.feed{flex:1;overflow-y:auto;padding:10px 0 20px}
.col{max-width:640px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;gap:20px}
.brief h4{display:flex;align-items:center;gap:8px;color:#FF8FBF;font-size:15px;margin-bottom:6px}
.brief p{color:#E2D8DE}
.brief .rel{margin-top:6px;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:#D9CFD6;margin-bottom:10px}
.who .mini{width:26px;height:26px;border-radius:50%;overflow:hidden;position:relative;flex:none}
.msg .txt p{margin:0 0 12px;color:#E6DCE2;line-height:1.75}
.msg .txt p.say{font-weight:700;background:linear-gradient(90deg,var(--pink),var(--peach));-webkit-background-clip:text;background-clip:text;color:transparent}
.msg .txt[contenteditable=true]{outline:1px dashed rgba(255,62,142,.6);outline-offset:6px;border-radius:4px}

  const count=showingWorlds()?Object.keys(WORLD_DEMO).length:featuredIds.length;

  const worlds=showingWorlds(),ids=worlds?Object.keys(WORLD_DEMO):featuredIds;

  return `<img class="banner-cover" src="${worlds?item.cover:role.cover}" alt=""><div class="banner-shade"></div>

function paintHome(){
  closePreview();
  if(S.tab!=='role') return;
  document.getElementById('chips').innerHTML = chips.map((c,i)=>
    `<button class="chip ${i===S.chip?'cur':''} ${c.ev?'event':''}" onclick="S.chip=${i};S.tagPick=null;renderPage()">${c.i?`<svg width="15" height="15"><use href="#i-${c.i}"/></svg>`:''}${c.ev?'✦ ':''}${c.t}</button>`).join('');
  const q = S.q.trim().toLowerCase();
  if(chips[S.chip].t==='世界'){
    document.getElementById('result').textContent='';
    document.getElementById('grid').innerHTML=worldCards(q);return;
  }
  let list = ROLES.filter(chips[S.chip].f)
    .filter(r=>!S.tagPick || r.tags.includes(S.tagPick))
    .filter(r=>S.gender==='all' || (S.gender==='female'?isFemale(r):r.gender?r.gender==='男':!isFemale(r)))
    .filter(r=>!S.creator || r.by===S.creator)
    .filter(r=>!q || [r.name,r.desc,r.by,r.world,...r.tags].join(' ').toLowerCase().includes(q));
  if(S.sort==='following') list=list.filter(r=>followedCreators.has(r.by));
  if(S.sort==='editor') list=list.filter(r=>r.official);
  const activity=id=>Object.values(S.sessions).filter(s=>s.roleId===id).reduce((n,s)=>n+s.rounds,0);
  const keys={hot:r=>num(r.chats),recent:r=>activity(r.id)||num(r.stars)/(num(r.chats)||1),
    new:r=>r.id.startsWith('mine-')||r.by===ME?1e6-ROLES.indexOf(r):ROLES.indexOf(r),
    daily:r=>activity(r.id),editor:r=>num(r.stars),following:r=>num(r.chats)};
  list.sort((a,b)=>keys[S.sort](b)-keys[S.sort](a));
  const filtered = q || S.creator || S.tagPick || S.gender!=='all' || S.chip;
  document.getElementById('result').innerHTML = filtered
    ? `找到 ${list.length} 个角色${S.creator?`（创作者 @${esc(S.creator)}）`:''}${q?`（搜索“${esc(S.q)}”）`:''}<button onclick="resetFilters()">清除筛选</button>` : '';

// Keep the preview inside its card so moving into the expanded area keeps it open.
const hoverDevice = matchMedia('(any-hover: hover) and (any-pointer: fine) and (min-width: 700px)');
let previewTimer, previewCard;
function closePreview(){
  clearTimeout(previewTimer);
  if(previewCard){
    previewCard.querySelector('.role-preview')?.remove();
    previewCard.classList.remove('previewing');
    previewCard = null;
  }

function showPreview(card){
  const r = roleById(card.dataset.roleId);
  if(!r || !card.isConnected || !card.matches(':hover')) return;
  const bounds = card.getBoundingClientRect(), grid = card.closest('.grid').getBoundingClientRect();
  const width = Math.min(600, grid.width, document.documentElement.clientWidth - 16);
  const right = Math.min(grid.right, document.documentElement.clientWidth - 8);
  const left = Math.max(grid.left, Math.min(bounds.left + width <= right ? bounds.left : bounds.right - width, right - width));
  const panel = document.createElement('section');
  panel.className = 'role-preview';
  panel.style.width = width + 'px';
  panel.style.left = (left - bounds.left - 1) + 'px';
  panel.setAttribute('aria-label', r.name + '的角色预览');
  const intro = blurb(r);
  const paragraphs = [...new Set([intro, r.world, r.personality].filter(Boolean))];
  const saved = S.favs.has(r.id);
  panel.innerHTML = `<img class="preview-art" src="${esc(r.cover)}" alt="">
    <div class="preview-info"><h3>${esc(r.name)}</h3>
    <button class="by" data-action="creator">@${esc(r.by)}</button>
    <div class="preview-copy">${paragraphs.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    <div class="tags">${[...r.kinds,...r.tags].slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <span class="preview-meta">${r.chats ? esc(r.chats)+' 条消息 · '+esc(r.stars || 0)+' 点赞' : '新上架'}</span>
    <div class="preview-actions"><button class="btn" data-action="fav" aria-pressed="${saved}">${saved?'已收藏':'收藏'}</button>
    <button class="btn pri" data-action="chat">${TARGET_DEMO[r.id]?'开始挑战':S.sessions[r.id]?.msgs.length>1?'继续聊天':'开始聊天'}</button></div></div>`;
  panel.addEventListener('click', e=>{
    const button = e.target.closest('[data-action]');
    if(!button) return;
    e.stopPropagation();
    if(button.dataset.action==='fav'){
      toggleFav(r.id);
      const on = S.favs.has(r.id);
      button.textContent = on?'已收藏':'收藏';
      button.setAttribute('aria-pressed', on);
      const star = card.querySelector('.fav');
      star.classList.toggle('on', on);
      star.setAttribute('aria-label', on?'取消收藏':'收藏');
      if(route==='me') renderPage();
      return;
    }
    closePreview();
    if(button.dataset.action==='chat'){if(TARGET_DEMO[r.id])startChallenge(r.id);else nav('chat',r.id);}
    else byCreator(r.by);
  });
  card.classList.add('previewing');
  card.append(panel);
}
document.addEventListener('pointerover', e=>{

  closePreview();
  previewCard = card;
  previewTimer = setTimeout(()=>showPreview(card), 250);

document.addEventListener('pointerout', e=>{

/* 下拉菜单 */
let menuEl = null;
function openMenu(anchor, html){
  closeMenu(); menuEl = document.createElement('div'); menuEl.className='menu'; menuEl.innerHTML = html;
  document.body.appendChild(menuEl);
  const a = anchor.getBoundingClientRect(), m = menuEl.getBoundingClientRect();
  let left = Math.min(a.left, innerWidth - m.width - 12), top = a.bottom + 6;
  if(top + m.height > innerHeight - 8) top = Math.max(8, a.top - m.height - 6);
  menuEl.style.left = Math.max(8,left)+'px'; menuEl.style.top = top+'px';
  setTimeout(()=>addEventListener('click', outside), 0);
}
function outside(e){ if(menuEl && !menuEl.contains(e.target)) closeMenu(); }
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; removeEventListener('click', outside); } }
const mi = (label, fn, curr, right='') => `<button class="${curr?'cur':''}" onclick="closeMenu();${fn}">${label}${curr?'<svg width="14" height="14" style="margin-left:auto"><use href="#i-check"/></svg>':right?`<span class="r">${right}</span>`:''}</button>`;

  return `<div class="ph"><div><h1>最近聊天</h1><p>从上次停下的地方接着聊。</p></div></div>

function setTier(i, grant=false){
  S.tier = i; S.quota = {...TIERS[i].quota};
  if(MODELS[S.model].need > i) S.model = 'base';
  if(grant && TIERS[i].monthly) addCoins(TIERS[i].monthly, TIERS[i].name+'已开通');
  renderShell(); paintModel(); paintTier();
  if(document.getElementById('app').classList.contains('on')) renderPage();
}
function paintTier(){ const sel = document.querySelector('#demoTier select'); if(sel) sel.value = S.tier; }
function doBuy(kind,n){
  if(kind==='tier') setTier(n, true);
  else { addCoins(n,'购买成功'); renderPage(); }
}
function needTier(i, what){
  openModal(`<div class="pad"><h2>${what}需要${TIERS[i].name}</h2><p class="sub">${TIERS[i].name}每月 $${TIERS[i].price}。日常聊天不受影响。</p>

/* 消息结构：{who:'ai', versions:[[{t:'n'|'s', x}]], v} 或 {who:'me', text} */
function parseGreeting(g){
  const parts = g.split(/(（[^）]*）)/).filter(s=>s.trim());
  return parts.map(s=> s.startsWith('（') ? {t:'n',x:s.slice(1,-1).replace(/，$/,'。')} : {t:'s',x:'“'+s.trim()+'”'});
}

/* 演示回复：未接模型，按角色名和玩家原话拼出旁白 + 台词 */
const NARR = ['{n}听完，停顿了一下。','{n}把手里的东西放下，认真看着{u}。','{n}轻轻笑了一声，移开视线又看回来。','{n}没有马上回答，指尖在桌沿敲了两下。','{n}往{u}这边走近了半步。'];
const SAY  = ['“你这么说，我倒是有点意外。再多说一点？”','“好，我记住了。接下来你想怎么做？”','“再说一遍——我想确认我没听错。”','“那就按你说的来。不过，你得陪我把这件事做完。”','“……你总是这样，让人没办法拒绝。”','“先别急着走。外面还在下雨。”'];
const CONT = ['{n}像是想起了什么，又补了一句。','沉默了一会儿，{n}的语气软了下来。'];
const SUG  = ['（愣了一下）你在等我？','好，我听你说。不过你得先告诉我为什么。','（没有回答，只是看着对方）','我今天有点累，能陪我坐一会儿吗？','你还记得我上次说的那件事吗？','（笑了笑）你今天好像心情不错。','先说好，这次换我来决定。','如果我说不呢？'];
const pickN = (arr,k) => [...arr].sort(()=>Math.random()-.5).slice(0,k);
const fill = (t,r) => t.replaceAll('{n}',short(r.name)).replaceAll('{u}',S.persona.call||'你');
function mockReply(r, userText, mode){
  if(mode==='cont') return [{t:'n',x:fill(pickN(CONT,1)[0],r)},{t:'s',x:pickN(SAY,1)[0]}];
  const lockHint = activeChat().facts.find(f=>f.lock && userText && userText.includes(f.x.slice(0,2)));
  return [{t:'n',x:fill(pickN(NARR,1)[0],r)},{t:'s',x: lockHint ? `“我记得——${lockHint.x}。这件事不会变。”` : pickN(SAY,1)[0]}];
}
function renderSuggest(refresh){
  const el = document.getElementById('suggest'), world=WORLD_DEMO[activeChat()?.world];
  if(!S.settings.suggest){ el.innerHTML=''; return; }
  const suggestions=world?[world.prompt,...pickN(SUG,2)]:pickN(SUG,3);
  el.innerHTML = suggestions.map(t=>`<button class="glass" onclick="msgInput.value=this.textContent;msgInput.focus()">${esc(t)}</button>`).join('');
  if(refresh) toast('换了一批建议回复');
}

function charge(){
  /* PRD 3.4 规则 1：先扣当天该模型的额度，不够的差额从花瓣扣 */
  const c = MODELS[S.model].cost, q = S.quota[S.model] || 0, need = Math.max(0, c - q);
  if(S.coins < need){
    openModal(`<div class="pad"><h2>花瓣不够了</h2><p class="sub">这一条还差 ${need - S.coins} 花瓣。你写的话还留在输入框里。</p>
      <div class="formbar"><button class="btn" onclick="closeModal();buy('coin',${PACKS[0][0]},${PACKS[0][1]})">买 ${PACKS[0][0]} 花瓣</button><button class="btn pri" onclick="closeModal();buy('tier',1)">开通入门会员</button></div></div>`);
    return false;
  }
  if(q) S.quota[S.model] = q - Math.min(q, c);
  S.coins -= need; renderShell(); return true;
}

  playEl('feed').innerHTML='<div class="brief"><h4>'+icon('book')+esc(r.story||'故事简介')+'</h4><p>'+esc(blurb(r))+'</p></div>'+s.msgs.map((m,i)=>msgHTML(m,i,i===lastAi)).join('');

function sceneReply(s,text,context){
  const r=roleById(s.roleId), w=WORLD_DEMO[context?.world], note=context?.topic;
  if(w && note){
    const voice=w.voices[r.id] || ['朝你靠近一点。',''];
    const line=note.dialogue[r.id] || voice[1]+note.body;
    const reply=[{t:'n',x:short(r.name)+voice[0]},{t:'s',x:'“'+line+'”'}];
    const trigger=TARGET_DEMO[r.id]?.trigger;
    if(trigger && s.challenge && text.includes(trigger) && !line.includes(trigger))reply[0].x+='他给你拍下了'+trigger+'的样子。';
    return reply;
  }
  const reply=mockReply(r,text),trigger=TARGET_DEMO[r.id]?.trigger;
  if(trigger && s.challenge && text.includes(trigger))reply[0].x+='他给你拍下了'+trigger+'的样子。';
  return reply;
}
function pair(s,text){
  s.msgs.push({who:'me',text});
  const recent=s.msgs.filter(m=>m.who==='me').slice(-2).map(m=>m.text);
  const context=worldContext(s.world,recent);
  const m={who:'ai',v:0,versions:[sceneReply(s,text,context)],context,notes:context.notes};
  if(s.challenge && TARGET_DEMO[s.roleId].trigger && text.includes(TARGET_DEMO[s.roleId].trigger)){
    m.src=roleById(s.roleId).cover;addPhoto(s.roleId,m.src);
  }
  s.msgs.push(m);s.totalTurns++;s.updated=Date.now();
  if(!s.challenge || s.status==='active')s.rounds++;
  if(s.challenge && s.status==='active'){m.round=s.rounds;m.before=s.score;}
  return m;
}
function send(){
  const s=activeChat(),inp=playEl('msgInput'),text=inp.value.trim();
  if(s.status==='lost')return;
  if(!text){inp.focus();return;}
  if(!charge())return;
  const m=pair(s,text);s.draft='';inp.value='';
  if(s.challenge && s.status==='active'){
    const rule=s.nextRule;delete s.nextRule;
    if(rule!==undefined || s.rounds>=TARGET_DEMO[cur].limit)settle(s,m,rule?.value||0,rule?.name);
  }
  renderFeed();renderSuggest();
}
function act(kind){
  const s=activeChat(),m=s.msgs.findLast(m=>m.who==='ai');
  if(!m||s.status==='lost'||!charge())return;
  if(kind==='redo'){m.versions.push(sceneReply(s,lastUser(s),m.context));m.v=m.versions.length-1;}
  else {
    const next=m.notes?.find(n=>n!==m.context?.topic && !m.versions[m.v].some(p=>p.x.includes(n.body)));
    m.versions[m.v].push(...(next?[{t:'s',x:'“'+next.body+'”'}]:mockReply(roleById(cur),'','cont')));
  }
  s.updated=Date.now();renderFeed();
}
const lastUser=s=>s.msgs.findLast(m=>m.who==='me')?.text||'';
function settle(s,m,value,name){
  if(s.status!=='active'||m.scored)return;
  const g=TARGET_DEMO[s.roleId];
  s.score=Math.min(100,Math.max(0,m.before+Math.max(-15,Math.min(15,value))));
  m.ruleName=name||g.rules.find(rule=>rule.value===value)?.name||'';m.delta=s.score-m.before;m.capped=Math.abs(value)>15;m.scored=true;
  if(s.score===100)winChallenge(s);
  else if(s.rounds>=g.limit)s.status='lost';
}
function winChallenge(s){
  const g=TARGET_DEMO[s.roleId],repeat=Object.hasOwn(wonRecords,s.roleId),art=g.art||roleById(s.roleId).cover;s.status='won';
  wonRecords[s.roleId]=Math.min(wonRecords[s.roleId]??Infinity,s.rounds);
  openModal(`<div class="pad win-card">${art?`<img class="win-art" src="${esc(art)}" alt="达成立绘">${!g.art?'<p class="hint">演示：正式版为专属立绘</p>':''}`:''}<h2>恭喜！你已成功完成目标！</h2>${art?'<p class="sub">'+(repeat?'立绘已在图鉴中':'已收入图鉴')+'</p>':''}<p class="hint">${esc(g.name)} 100/100 · ${s.rounds} 回合</p>${rankHTML(s.roleId)}<div class="formbar"><button class="btn pri" onclick="closeModal()">继续聊</button><button class="btn" onclick="closeModal();galleryTab='达成';nav('gallery')">去图鉴</button></div></div>`);
}
function demoRule(value,index){
  const s=activeChat();if(s.status!=='active')return;
  const m=s.msgs.findLast(m=>m.round);
  const name=TARGET_DEMO[cur].rules[index]?.name;
  if(m && !m.scored)settle(s,m,value,name);
  else {s.nextRule={value,name};toast('已选定下一轮变化');}
  renderFeed();
}
function demoFinish(win){
  const s=activeChat();if(s.status!=='active')return;
  const g=TARGET_DEMO[cur];delete s.nextRule;
  const m=s.msgs.findLast(m=>m.round);
  if(m&&!m.scored)settle(s,m,win?15:0);
  while(s.status==='active' && s.rounds<g.limit){
    const m=pair(s,win?'我愿意陪你把这件事做完。':'我在听，继续说吧。');
    if(win && m.round===g.limit && m.before<85){s.score=100;m.delta=0;m.scored=true;winChallenge(s);}
    else settle(s,m,win?15:0);
  }
  renderFeed();
}

function paintChallenge(){

  playEl('goalHud').hidden=!g;
  if(g){

// 离线演示使用字符预算；整条笔记载入，历史消息保留当时的笔记。
function worldContext(world,lines){
  const notes=[], candidates=[], recent=lines.slice(-2).map(line=>line.toLowerCase());
  for(const note of WORLD_DEMO[world]?.notes||[]){
    const last=recent.findLastIndex(line=>note.keywords.some(k=>line.includes(k.toLowerCase())));
    if(note.mode==='always'||last>=0)candidates.push({note,last});
  }
  candidates.sort((a,b)=>b.note.priority-a.note.priority || b.last-a.last);
  let remaining=320;
  for(const {note} of candidates){
    if(notes.length===3)break;
    if(note.body.length>remaining)continue;
    notes.push(note);remaining-=note.body.length;
  }
  const hits=candidates.filter(c=>c.last>=0 && notes.includes(c.note)).sort((a,b)=>b.last-a.last || b.note.priority-a.note.priority);
  return {world,notes,topic:hits[0]?.note||null};
}

      return won?galleryArtButton(src,r.name+' · 达成立绘',card):`<div class="w-art-card">${card}</div>`;
    }).join('')}</div>`:galleryPhotos.length?`<div class="w-gallery">${galleryPhotos.map(p=>{
      const name=roleById(p.roleId)?.name||'角色',title=name+' · 对话照片';
      return galleryArtButton(p.src,title,`<div class="w-frame"><img src="${esc(p.src)}" alt=""></div><div class="w-caption"><b>${esc(name)}</b><small>${new Date(p.at).toLocaleString('zh-CN')}</small></div>`);
    }).join('')}</div>`:'<div class="empty"><strong>相册还是空的</strong><span>在聊天里点『拍一张』，他会发来照片</span></div>'}`;
}

/* 创作入口和目标玩法草稿，随本次页面会话保留。 */
const builderIcon = (key,size=20)=>`<svg width="${size}" height="${size}" aria-hidden="true"><use href="#i-${key}"/></svg>`;
function openCreation(){
  document.querySelector('.side').classList.remove('mobile-open');
  openModal(`<section class="pad builderEntry"><h2>创作</h2><div class="builderChoices">
    <button class="builderChoice big" onclick="closeModal();nav('create')">${builderIcon('spark',34)}<b>建立角色</b><small>打造你独一无二的角色</small></button>
    <button class="builderChoice" onclick="closeModal();nav('canvas')"><b>建立目标玩法</b><small>为你的角色设定状态追踪器</small>${builderIcon('target',28)}</button></div></section>`);
}
const builderPair=()=>({character:null,goal:null});
const targetCanvas={title:'目标玩法',intro:true,nodes:[builderPair()]};
const builderExamples={boost:'关心或送礼 +5\n认同角色 +5\n花时间陪伴 +5',loss:'冷落 −5\n做对方不喜欢的事 −5\n强迫对方违背原则 −5'};
function pCanvas(){
  return `<section class="builderCanvas"><header class="builderBar"><button class="btn sm" aria-label="返回首页" onclick="nav('home')">${builderIcon('left',16)}</button><label class="builderTitle"><input aria-label="玩法标题" value="${esc(targetCanvas.title)}" oninput="targetCanvas.title=this.value" placeholder="未命名玩法">${builderIcon('edit',15)}</label><span class="builderBadge">草稿</span>
    <button class="btn sm builderAdd" onclick="targetCanvas.nodes.push(builderPair());renderPage();document.querySelector('.builderPair:last-child').scrollIntoView({block:'center'})">＋ 新增目标角色</button></header>
    <div class="builderBoard">${targetCanvas.intro?`<aside class="builderNote"><span>目标中的角色会在聊天页面显示状态栏。你可以定义数值增加或减少的规则，玩家透过和角色聊天来达成目标；数值到 100 时，即视为挑战成功。</span><button aria-label="关闭说明" onclick="targetCanvas.intro=false;renderPage()">${builderIcon('x',16)}</button></aside>`:''}
    <div class="builderNodes">${targetCanvas.nodes.map(({character:c,goal:g},i)=>`<article class="builderPair"><h3>目标角色</h3><div class="builderGraph">
      <button class="builderNode character" onclick="openBuilderDrawer(${i},'character')">${c?`<img src="${esc(c.cover)}" alt=""><strong>${esc(c.name)}</strong><span class="builderBadge">草稿</span><small>${esc(c.desc)}</small>`:`${builderIcon('user',30)}<strong>＋ 新增角色资讯</strong>`}</button>
      <span class="builderConnector" aria-hidden="true"></span><button class="builderNode goal" onclick="openBuilderDrawer(${i},'goal')">${g?`<strong>${esc(g.name)}</strong><span class="builderBadge">草稿</span><small>初始 ${g.initial} · ${g.limit} 回合</small>`:'＋ 新增目标'}</button></div></article>`).join('')}</div>
    <footer><button class="btn pri" onclick="publishTargetCanvas()">储存目标玩法</button></footer></div></section>`;
}
function builderField(label,key,value='',options={}){
  const {hint='',rows=0,attrs='',placeholder=''}=options;
  return `<div class="field"><label for="builder-${key}">${label}</label>${rows?`<textarea id="builder-${key}" name="${key}" rows="${rows}" placeholder="${esc(placeholder)}" ${attrs}>${esc(value)}</textarea>`:`<input id="builder-${key}" name="${key}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs}>`}${hint?`<small>${hint}</small>`:''}</div>`;
}
function builderSelect(label,key,value,choices){
  return `<div class="field"><label for="builder-${key}">${label}</label><select id="builder-${key}" name="${key}">${choices.map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select></div>`;
}
function builderPhoto(cover,goal){
  return `<div class="field"><label for="builder-image">${goal?'达成立绘 <small>达成目标时解锁，收入玩家图鉴</small>':'角色照片与档案 *'}</label><label class="builderPhoto" for="builder-image"><img id="builder-image-preview" ${cover?`src="${esc(cover)}"`:'hidden'} alt="图片预览"><span>${builderIcon('plus',24)} ${goal?'选择成就插图':'上传角色照片'}</span></label>
    <input id="builder-image" class="builderFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp" onchange="loadBuilderFile(this,'image')">
    ${goal?'':`<label class="builderImport" for="builder-import">导入角色 PNG / JSON</label><input id="builder-import" class="builderFile" type="file" accept=".png,.json" onchange="loadBuilderFile(this,'card')"><small>照片支持 PNG、JPG、GIF、WebP，小于 5 MB。</small>`}</div>`;
}
function builderCharacterFields(c){
  return builderPhoto(c.cover,false)+builderField('角色名 *','name',c.name,{attrs:'maxlength="40" required',placeholder:'最多 40 个字符'})+
    `<div class="builderRow">${builderSelect('性别','gender',c.gender,['未设置','女','男','非二元','其他'])}${builderField('年龄','age',c.age,{attrs:'maxlength="8"'})}</div>`+
    builderField('角色简介 *','desc',c.desc,{rows:3,attrs:'required minlength="3"',placeholder:'至少 3 个字符'})+
    builderField('问候语','greeting',c.greeting,{rows:3,placeholder:'角色想对玩家说的第一句话'})+
    builderField('个性','personality',c.personality,{rows:3})+builderField('外观','appearance',c.appearance,{rows:2})+
    builderField('情境','scenario',c.scenario,{rows:2})+builderField('标签','tags',(c.tags||[]).join(' '),{hint:'最多 9 个，用空格或逗号分开。'})+
    builderSelect('可见性','visibility',c.visibility,['公开','未列出','私人']);
}
function builderGoalFields(g){
  return builderField('目标名 *','name',g.name,{attrs:'maxlength="30" required',placeholder:'例如：好感',hint:'最多 30 个字符。'})+
    `<div class="field"><div class="builderDescHead"><label for="builder-desc">目标说明 *</label><button type="button" class="btn sm" onclick="toast('演示：正式版由 AI 生成')">${builderIcon('spark',15)}AI 总结</button></div><textarea id="builder-desc" name="desc" rows="3" required>${esc(g.desc)}</textarea><small>向玩家展示，不进入聊天上下文。</small></div>`+
    `<div class="builderRow">${builderField('初始分 *','initial',g.initial??0,{attrs:'type="number" min="0" max="99" required',hint:'0–99 分'})}
    ${builderField('最大回合 *','limit',g.limit??10,{attrs:'type="number" min="1" max="50" required',hint:'1–50 回合。玩家发一条、角色回一条算一回合。'})}</div>
    <h3 class="builderRuleTitle">分数变化规则</h3><p class="hint">对玩家隐藏。每行写一条行为及对应分值。</p>`+
    ruleFields('boost','加分规则',g.boost)+ruleFields('loss','扣分规则',g.loss)+builderPhoto(g.art,true);
}
function ruleRow(k,line,index) {
  const id='builder-'+k+(index?'-'+index:'');
  const example=builderExamples[k].split('\n')[index]||'行为和分值';
  return `<div class="rule-row"><textarea id="${id}" rows="1" aria-label="${k==='boost'?'加分':'扣分'}规则第 ${index+1} 行" placeholder="${esc(example)}" oninput="editRuleRow(this,'${k}')" onkeydown="ruleRowKey(event,'${k}')">${esc(line)}</textarea><small class="builderRuleHint" aria-live="polite">${ruleWarning(line)}</small></div>`;
}
function ruleWarning(line){return Number(line.trim().match(/(\d+)\s*分?$/)?.[1])>15?'单轮最多 ±15，超出部分按 15 计':'';}
function ruleFields(k,label,value){
  const lines=(value||'').split('\n');
  while(lines.length<3)lines.push('');
  return `<div class="field"><label for="builder-${k}">${label} *</label><div id="rules-${k}">${lines.map((line,i)=>ruleRow(k,line,i)).join('')}</div>
    <textarea name="${k}" hidden>${esc(value||'')}</textarea><div class="rule-actions"><button type="button" class="btn sm" onclick="appendRule('${k}')">＋ 新增一行</button><button type="button" class="btn sm" onclick="useBuilderExample('${k}')">使用${label}示例</button></div></div>`;
}
function appendRule(k){
  const group=document.getElementById('rules-'+k);
  group.insertAdjacentHTML('beforeend',ruleRow(k,'',group.children.length));
  group.lastElementChild.querySelector('textarea').focus();
}
function ruleRowKey(event,k){
  if(event.key!=='Enter'||event.isComposing)return;
  event.preventDefault();
  const next=event.target.closest('.rule-row').nextElementSibling;
  if(next)next.querySelector('textarea').focus();else appendRule(k);
}
function editRuleRow(field,k){
  const group=document.getElementById('rules-'+k);
  if(field.value.includes('\n')){
    const fields=[...group.querySelectorAll('textarea')],index=fields.indexOf(field);
    const lines=fields.flatMap(f=>f.value.split('\n'));
    group.innerHTML=lines.map((line,i)=>ruleRow(k,line,i)).join('');
    group.querySelectorAll('textarea')[index+field.value.split('\n').length-1].focus();
  } else field.nextElementSibling.textContent=ruleWarning(field.value);
  group.parentElement.querySelector('textarea[name]').value=[...group.querySelectorAll('textarea')].map(f=>f.value.trim()).filter(Boolean).join('\n');
}
function useBuilderExample(k){
  const group=document.getElementById('rules-'+k);
  group.innerHTML=builderExamples[k].split('\n').map((line,i)=>ruleRow(k,line,i)).join('');
  editRuleRow(group.querySelector('textarea'),k);
}
function openBuilderDrawer(i,type){
  const node=targetCanvas.nodes[i];
  if(type==='goal'&&!node.character){toast('请先新增角色资讯');return;}
  const char=type==='character',data=node[type]||{};
  openModal(`<form class="builderForm" id="builder-form" onsubmit="saveBuilderDraft(event,${i},'${type}')"><header><h2>${char?'建立角色':'编辑目标'}</h2></header><div class="builderScroll">
    ${char?builderCharacterFields(data):builderGoalFields(data)}</div><footer><button class="btn pri">${char?'储存草稿':'储存目标草稿'}</button></footer></form>`);
  document.getElementById('modal').classList.add('builderDrawer');
  document.getElementById('builder-form').dataset.image=(char?data.cover:data.art)||'';
}
function builderReadPNG(buffer){
  const view=new DataView(buffer),bytes=new Uint8Array(buffer),utf8=new TextDecoder();
  if(view.byteLength<8||view.getUint32(0)!==0x89504e47) throw Error('请选择 PNG 角色卡');
  let data=null;
  for(let offset=8;offset+12<=view.byteLength;){
    const len=view.getUint32(offset),start=offset+8,end=start+len;
    if(end+4>bytes.length) throw Error('角色卡 PNG 文件不完整');
    if(view.getUint32(offset+4)===0x74455874){
      const chunk=bytes.subarray(start,end),zero=chunk.indexOf(0),key=utf8.decode(chunk.subarray(0,zero));
      if(['chara','ccv3'].includes(key)) data=JSON.parse(utf8.decode(Uint8Array.from(atob(utf8.decode(chunk.subarray(zero+1))),c=>c.charCodeAt(0))));
    }
    offset=end+4;
  }
  return data;
}
async function loadBuilderFile(input,kind){
  const file=input.files[0],form=input.form;if(!file||!form)return;
  const submit=form.querySelector('button[type="submit"],footer button');
  form.dataset.upload=String((Number(form.dataset.upload)||0)+1);
  const version=form.dataset.upload;submit.disabled=true;
  try{
    let cardData=null,cover='';
    if(kind==='card'&&/\.json$/i.test(file.name)){cardData=JSON.parse(await file.text());}
    else{
      if(!['image/jpeg','image/png','image/gif','image/webp'].includes(file.type)||file.size>=5*1024*1024)throw Error('请选择小于 5 MB 的支持格式图片');
      if(kind==='card')cardData=builderReadPNG(await file.arrayBuffer());
      cover=await new Promise((ok,fail)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=fail;reader.readAsDataURL(file);});
      const preview=new Image();preview.src=cover;await preview.decode();
    }
    if(!form.isConnected||version!==form.dataset.upload)return;
    if(cardData){
      const data=cardData.data??cardData;
      if(typeof data!=='object'||Array.isArray(data))throw Error();
      const fields={name:data.name,desc:data.description??data.desc,greeting:data.first_mes??data.greeting,personality:data.personality,appearance:data.appearance,scenario:data.scenario,tags:Array.isArray(data.tags)?data.tags.slice(0,9).join(' '):undefined};
      if(!Object.values(fields).some(v=>typeof v==='string'&&v.trim()))throw Error('未找到角色资料');
      Object.entries(fields).forEach(([key,value])=>{if(typeof value==='string')form.elements[key].value=key==='name'?value.slice(0,40):value;});
      // JSON cards may embed an avatar. Accept only raster image data, never a remote URL.
      if(!cover&&typeof (data.avatar??data.cover)==='string'&&/^data:image\/(?:png|jpeg|gif|webp);base64,[a-z0-9+/=]+$/i.test(data.avatar??data.cover)) cover=data.avatar??data.cover;
    }
    if(cover){form.dataset.image=cover;const img=form.querySelector('#builder-image-preview');img.src=cover;img.hidden=false;}
    toast(kind==='card'?'角色文件已导入':'图片已添加');
  }catch(e){if(form.isConnected&&version===form.dataset.upload)toast(e.message?.startsWith('请')||e.message==='未找到角色资料'?e.message:'文件读取失败，请检查文件格式');}
  finally{if(version===form.dataset.upload)submit.disabled=false;input.value='';}
}
function readBuilderRules(text,sign){
  return text.trim().split(/\n/).map(line=>line.trim()).filter(Boolean).map(line=>{
    const m=line.match(/^(.+?)\s*([+＋\-−－]?)\s*(\d+)\s*分?$/);
    if(!m||!m[1].trim()||Number(m[3])<1||!Number.isSafeInteger(Number(m[3]))||(sign===1&&['-','−','－'].includes(m[2]))||(sign===-1&&['+','＋'].includes(m[2])))throw Error('每行请写一条行为和对应分值，例如「关心或送礼 +5」');
    return {name:m[1].trim(),value:sign*Number(m[3])};
  });
}
function saveBuilderDraft(event,i,type){
  event.preventDefault();const form=event.target,data=Object.fromEntries(new FormData(form));
  Object.keys(data).forEach(k=>{if(typeof data[k]==='string')data[k]=data[k].trim();});
  if(!data.name){toast('请输入名称');return;}
  if(type==='character'){
    if(!form.dataset.image){toast('请先上传角色照片');return;}
    if(data.desc.length<3){toast('角色简介至少 3 个字符');return;}
    data.tags=[...new Set(data.tags.split(/[\s,，、]+/).filter(Boolean))];
    if(data.tags.length>9){toast('标签最多 9 个');return;}
    data.cover=form.dataset.image;
  }else{
    if(!data.desc||!data.boost||!data.loss){toast('请填写目标描述和加减分规则');return;}
    try{data.rules=[...readBuilderRules(data.boost,1),...readBuilderRules(data.loss,-1)];}catch(error){toast(error.message);return;}
    data.initial=Number(data.initial);data.limit=Number(data.limit);data.art=form.dataset.image;
  }
  targetCanvas.nodes[i][type]=data;closeModal();renderPage();toast('草稿已保存');
}
function publishTargetCanvas(){
  if(targetCanvas.nodes.some(n=>!n.character||!n.goal)){toast('请先保存每个角色和目标的草稿');return;}
  targetCanvas.nodes.forEach(({character:c,goal:g})=>{
    const id='target-'+crypto.randomUUID();
    ROLES.unshift({...c,id,by:ME,official:false,chats:'',stars:'',category:'单人卡',kinds:['目标','图片'],story:'',world:c.scenario||c.desc,relationship:'刚认识',greeting:c.greeting||'你好，很高兴遇见你。',playMode:targetCanvas.title||'目标玩法'});
    TARGET_DEMO[id]={name:g.name,desc:g.desc,initial:g.initial,limit:g.limit,rules:g.rules,art:g.art,trigger:'照片',ranks:[],world:''};
  });
  Object.assign(targetCanvas,{title:'目标玩法',intro:true,nodes:[builderPair()]});showTargets();toast('已发布，可在首页『目标』中找到');
}

/* ================= 启动 ================= */
onRoute();
</script>
